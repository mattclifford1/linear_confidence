[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deltas"
version = "0.1.0"
description = "deltas: learning the confidence bounds of linear classifiers in feature space."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Matt Clifford", email = "matt.clifford@bristol.ac.uk"},
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.67",
    "joblib>=1.4",
    "imbalanced-learn>=0.13",
    # datasets and projection-capable models live in the sibling repos; see
    # [tool.uv.sources] below and CLAUDE.md
    "toy-datasets",
    "projection-models",
    # umap-learn (a toy_datasets dependency) has no lower bound on its own
    # transitive numba/llvmlite stack, so the resolver happily picks
    # llvmlite 0.36, which refuses to build on python >= 3.10. Pin the floor.
    "pynndescent>=0.6",
    "numba>=0.61",
    "llvmlite>=0.44",
]

[project.optional-dependencies]
# the torch nets under deltas/classifiers (MNIST, MIMIC, large-margin loss).
# Not needed for the tabular pipeline or any of the papers' headline results.
torch = ["torch>=2.0", "torchvision>=0.15"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "notebook>=7.0",
    "ipywidgets>=8.0",
]

# The sibling repos are not on PyPI. They are checked out next to this one and
# installed editable, so a change there is picked up here without reinstalling.
[tool.uv.sources]
toy-datasets = {path = "../../Repos/toy_datasets", editable = true}
projection-models = {path = "../../Repos/projection_models", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["deltas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: characterisation tests pinning the legacy estimators' exact outputs (~30 s; deselect with -m 'not golden')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
